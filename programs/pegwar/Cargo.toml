[package]
name = "pegwar"
version = "0.1.0"
description = "Peg War: multiplayer Plinko on MagicBlock's private rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pegwar"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "access-control", "vrf"] }
solana-sha256-hasher = "3.1.0"
mpl-core = "0.12.1"
anchor-spl = { version = "1.2.1", default-features = false, features = ["solana-v3", "token", "associated_token"] }

[dev-dependencies]
# only to prove the hand-rolled ScheduleTask bytes match MagicBlock's own enum
magicblock-magic-program-api = { version = "=0.10.1", default-features = false }
bincode = "1.3.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
