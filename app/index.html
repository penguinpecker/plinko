<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plinko</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b0639'/%3E%3Cg fill='%23a4c9ff'%3E%3Ccircle cx='16' cy='8' r='2'/%3E%3Ccircle cx='10' cy='16' r='2'/%3E%3Ccircle cx='22' cy='16' r='2'/%3E%3Ccircle cx='4' cy='24' r='2'/%3E%3Ccircle cx='16' cy='24' r='2'/%3E%3Ccircle cx='28' cy='24' r='2'/%3E%3C/g%3E%3Ccircle cx='13' cy='11.5' r='3.4' fill='%23f26aff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=account_balance_wallet,bolt,check,content_copy,emoji_events,link,north_east,progress_activity,smart_toy,verified,volume_off,volume_up&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Plinko home">
        <svg class="mark" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="#a4c9ff"><circle cx="16" cy="8" r="2" /><circle cx="10" cy="16" r="2" /><circle cx="22" cy="16" r="2" /><circle cx="4" cy="24" r="2" /><circle cx="16" cy="24" r="2" /><circle cx="28" cy="24" r="2" /></g>
          <circle cx="13" cy="11.5" r="3.4" fill="#f26aff" />
        </svg>
        <span class="word head">PLINK<span>O</span></span>
      </a>
      <span class="chip net cut"><i class="live"></i><span class="micro">Solana devnet</span></span>
      <span class="chip attest cut" id="attest" data-st="checking" title="MagicBlock private rollup attestation"><span class="ms">progress_activity</span><span class="micro">Verifying TEE…</span></span>
      <span class="grow"></span>
      <button class="ghost icon cut" id="mute" title="Sound" aria-label="Toggle sound"><span class="ms">volume_up</span></button>
      <span class="micro acct" id="wallet-label" hidden>Instant wallet</span>
      <button class="addr cut acct" id="addr" title="Copy address" hidden>…</button>
      <span class="balpill cut acct" hidden><span class="ms">account_balance_wallet</span><b class="num" id="bal">…</b></span>
      <button class="ghost cut acct" id="airdrop" hidden>Get devnet SOL</button>
      <button class="ghost cut" id="phantom" hidden>Phantom</button>
      <button class="cta sm" id="connect" hidden><span class="ms fill">account_balance_wallet</span><span>Connect</span></button>
    </header>

    <section class="ticker" aria-label="On-chain transactions">
      <div class="tk-head"><h2 class="head">On-chain</h2><span class="micro"><i class="live"></i><span id="txcount">0 txs</span></span></div>
      <ol class="txs" id="txs"></ol>
    </section>

    <main class="layout">
      <aside class="side">
        <section id="phase"></section>
        <section class="controls panel cut" id="controls" hidden>
          <button class="cta drop" id="drop"><span id="drop-label">Drop ball</span><kbd>Space</kbd></button>
          <div class="pips" id="pips"></div>
          <p class="hint" id="hint"></p>
        </section>
        <section class="table panel cut">
          <div class="hd"><span class="micro">Table</span><b class="num" id="seats">0/8</b></div>
          <ol class="players" id="players"></ol>
        </section>
        <section class="chat-card panel cut" id="chat-card" hidden>
          <div class="hd"><span class="micro">Rollup chat</span><small>lives only on the rollup</small></div>
          <ol class="chat" id="chat"></ol>
          <form class="say" id="say"><input class="cut" id="say-text" maxlength="48" placeholder="Talk trash" aria-label="Chat message" autocomplete="off" /><button class="sec">Send</button></form>
        </section>
      </aside>

      <section class="board-card cut">
        <div class="bhead">
          <span class="chip cut"><span class="micro">Pot</span><b class="num" id="pot">–</b></span>
          <span class="chip cut"><span class="micro">Tick</span><b class="num" id="tick">–</b></span>
          <span class="chip cut drop-chip"><span class="micro">Drop</span><b class="num" id="window">–</b></span>
          <span class="grow"></span>
          <span class="status micro" id="status" data-s="none">No round</span>
        </div>
        <div class="well">
          <canvas id="board" aria-label="Plinko board"></canvas>
        </div>
        <div class="recent"><span class="micro">Last drops</span><ol id="recent"></ol></div>
        <div class="toast cut" id="toast" role="status"></div>
      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
